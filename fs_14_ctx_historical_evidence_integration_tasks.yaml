project:
  name: AI Stock Analyst - FS-14 ctx Historical Evidence Integration
  path: D:\pet-projects\ai-stock-analyst
limits:
  taskTimeoutMinutes: 60
  reviewerTimeoutMinutes: 10
  maxTaskRetries: 1
  maxParallelTasks: 1
git:
  checkpointCommits: false
tasks:
  - key: fs14-evidence-boundary
    title: "FS14-T01: Historical evidence boundary and budget contract"
    prompt: >-
      Execute only FS14-T01 from the FS-14 ctx historical-evidence integration
      queue. Read AGENTS.md, the FS-14 plan and queue, source-of-truth hierarchy,
      context governance, retrieval governance, Project Map retrieval policy,
      and the automated queue protocol. Create the docs-only boundary contract
      specified by the queue. Freeze the admitted trigger reason codes, denied
      uses, fail-closed fallback, refresh-off default, maximum 3 results, event
      window 2, 8000 model-bound characters, 2000 estimated tokens, and the
      sanitized receipt fields. ctx output is untrusted historical evidence and
      cannot mutate canonical memory or grant authority. Do not install or run
      ctx, import/read history, access network, start a daemon/MCP server, or
      change runtime behavior. Update only the FS-14 task receipt and queue
      state. Run documentation harness, architecture lint, and git diff --check.
      Do not create a git commit.
    model: auto
    minModel: terra
    effort: high
    dependsOn: []
    resources: [fs14-context-integration]
    allowedPaths:
      - docs/owner_only/plans

  - key: fs14-adapter-scope
    title: "FS14-T02: Adapter and receipt schema scope"
    prompt: >-
      Execute only FS14-T02. Confirm FS14-T01 is complete. Define the docs-only
      local subprocess adapter and receipt schema: allowlisted argv without
      shell interpolation, JSON parsing, timeout, clipping, redaction, disabled
      default, error taxonomy, and sanitized provenance. Preserve the fixed
      FS14-T01 budgets and canonical fallback. Deny network, auto-install,
      setup/import/refresh, daemon/MCP startup, transcript persistence, and
      canonical mutation. Do not invoke ctx or read history. Update the FS-14
      task receipt and queue. Run documentation harness, architecture lint, and
      git diff --check. Do not create a git commit.
    model: auto
    minModel: terra
    effort: high
    dependsOn: [fs14-evidence-boundary]
    resources: [fs14-context-integration]
    allowedPaths:
      - docs/owner_only/plans

  - key: fs14-fixture-adapter
    title: "FS14-T03: Fixture-first adapter and budget enforcement"
    prompt: >-
      Execute only FS14-T03. Confirm FS14-T02 is complete. Implement a local
      fixture-first ctx evidence adapter core, deterministic synthetic JSON
      fixtures, sanitized receipts, CLI/test surface, and focused tests. Enforce
      trigger admission, disabled-default behavior, result/event/character/token
      budgets, clipping, timeout, malformed output, missing binary, and secret
      redaction before any model-bound output. Tests must not require ctx, real
      transcripts, network, or sensitive data. Do not integrate the adapter into
      ai_context_helper yet. Update the task receipt and queue. Run focused
      tests, fixture CLI, documentation harness, architecture lint, and git
      diff --check. Do not create a git commit.
    model: auto
    minModel: terra
    effort: high
    dependsOn: [fs14-adapter-scope]
    resources: [fs14-context-integration]
    allowedPaths:
      - docs/owner_only/plans
      - src/owner_only_sandbox
      - scripts
      - tests

  - key: fs14-local-preflight
    title: "FS14-T04: Local availability and compatibility preflight"
    prompt: >-
      Execute only FS14-T04. Confirm FS14-T03 is complete. Add a bounded,
      no-write preflight that detects an already installed compatible ctx CLI
      using version/status capabilities and emits only a sanitized receipt.
      Absence or incompatibility is a normal blocked result. Do not install,
      setup, import, refresh, start a daemon/MCP server, search transcripts, or
      access network. Update the task receipt and queue. Run focused tests,
      preflight tests with mocked subprocess outcomes, documentation harness,
      architecture lint, and git diff --check. Do not create a git commit.
    model: auto
    minModel: terra
    effort: high
    dependsOn: [fs14-fixture-adapter]
    resources: [fs14-context-integration]
    allowedPaths:
      - docs/owner_only/plans
      - src/owner_only_sandbox
      - scripts
      - tests

  - key: fs14-bounded-pilot
    title: "FS14-T05: Bounded local historical retrieval pilot"
    prompt: >-
      Execute only FS14-T05. Confirm FS14-T04 is complete and its receipt proves
      that an existing compatible local ctx binary and index are available. If
      not, record the queue blocker and stop without installation or import.
      Run only the five fixed, non-sensitive pilot scenarios admitted by the
      FS-14 contract using refresh off, limit 3, event window 2, and the fixed
      character/token budgets. Commit no transcript bodies; write only sanitized
      aggregate usefulness, false-positive, clipping, latency, failure, privacy,
      and budget metrics. Require at least 4/5 useful scenarios, zero authority
      promotions, zero privacy findings, and zero budget breaches. Do not access
      network or mutate canonical memory. Update the task receipt and queue. Run
      pilot receipt validation, documentation harness, architecture lint, and
      git diff --check. Do not create a git commit.
    model: auto
    minModel: terra
    effort: high
    dependsOn: [fs14-local-preflight]
    resources: [fs14-context-integration]
    allowedPaths:
      - docs/owner_only/plans
      - docs/owner_only/evidence
      - src/owner_only_sandbox
      - scripts
      - tests

  - key: fs14-helper-integration
    title: "FS14-T06: Opt-in context helper integration"
    prompt: >-
      Execute only FS14-T06. Confirm FS14-T05 completed with its acceptance gate
      passed; otherwise record a blocker and stop. Integrate the fixture-tested
      provider into ai_context_helper as an explicit trigger-gated path disabled
      by default. Preserve existing canonical retrieval output when disabled,
      unavailable, or blocked. No startup lookup, implicit transcript injection,
      auto-refresh, or canonical mutation is allowed. Every admitted lookup must
      be budgeted and receipt-backed. Update docs and the FS-14 task receipt and
      queue. Run tests/test_ai_context_helper.py, new focused tests,
      documentation harness, architecture lint, and git diff --check. Do not
      create a git commit.
    model: auto
    minModel: terra
    effort: high
    dependsOn: [fs14-bounded-pilot]
    resources: [fs14-context-integration]
    allowedPaths:
      - docs
      - src/owner_only_sandbox
      - scripts
      - tests

  - key: fs14-impact-decision
    title: "FS14-T07: Retrieval value and limit impact decision"
    prompt: >-
      Execute only FS14-T07. Confirm FS14-T06 is complete. Compare baseline and
      integrated retrieval for relevance, forbidden hits, latency, emitted
      characters, estimated tokens, clipping, and failure behavior. Produce an
      owner-review KEEP, REVISE, or DISABLE decision with a tested rollback path.
      Do not automatically promote historical claims or relax budgets. Update
      the final FS-14 receipt and mark the queue complete only when evidence is
      reproducible and privacy review is clear. Run the focused retrieval suite,
      documentation harness, architecture lint, and git diff --check. Do not
      create a git commit.
    model: auto
    minModel: terra
    effort: high
    dependsOn: [fs14-helper-integration]
    resources: [fs14-context-integration]
    allowedPaths:
      - docs
      - src/owner_only_sandbox
      - scripts
      - tests
