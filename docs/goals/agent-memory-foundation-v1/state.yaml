# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Agent Memory Foundation and Control-Plane Blueprint v1"
  slug: "agent-memory-foundation-v1"
  kind: open_ended
  tranche: "Integrate and prove the non-duplicative Kit foundation, then capture the evidence-backed target architecture and schema-valid launch queues."
  status: done
  oracle:
    signal: "A clean-environment walkthrough proves the selected Kit capability inside Orchestrator, and project-owned evidence/architecture docs plus launch queues validate without unstated chat context."
    cadence: "after each Worker package, at the integration phase gate, and at final audit"
    final_proof: "Receipts must include the integration diff, repository-native test/check results, behavior-level demonstration, documentation paths, queue validator results, and a final evidence-to-outcome audit."
  intake:
    original_request: "Integrate AI-assisted_System_Design_and_Agent_Memory_Kit first, then fix the larger Nikolay-like system concept in the project and prepare an implementation plan and launch queue."
    interpreted_outcome: "Orchestrator gains a verified memory/design foundation before the larger control-plane design and executable work queue are made durable."
    input_shape: vague
    audience: "Orchestrator owner and future implementation agents"
    authority: requested
    proof_type: artifact
    completion_proof: "Working verified integration, source-backed project documentation, and schema-valid launch queues with explicit scopes and guards."
    likely_misfire: "Copying the Kit or writing a speculative mega-plan without proving a useful integration or respecting current Orchestrator capabilities and queue constraints."
    blind_spots_considered:
      - "Overlap with existing context-contract, routing, prompt, persisted-state, telemetry, approval, GoalBuddy, and eval work."
      - "Kit license, runtime, dependency, schema, storage, migration, and rollback constraints."
      - "Canonical state ownership and the risk of introducing competing sources of truth."
      - "Evidence provenance across Telegram text, screenshots, public research, implementation facts, and inference."
      - "Unknown task boundaries prevent an ordinary Orchestrator queue from being safely created at intake."
    existing_plan_facts:
      - "The Kit integration must precede the final larger-system design."
      - "User-created queues belong under queues/ and are ignored by Git."
      - "Ordinary Orchestrator queues require at least two understood tasks with dependencies, allowedPaths, verificationCommands, and stop guards."
      - "The current repository already contains prior goal artifacts for context, prompts, state, telemetry, approvals, and evals; discovery must avoid duplication."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/agent-memory-foundation-v1/"
    command: "node C:/Users/Alexander Lozovoy/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.1/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/agent-memory-foundation-v1"

