version: 2

goal:
  title: "Context Router v1"
  slug: "context-router-v1"
  kind: existing_plan
  tranche: "Implement and verify the first end-to-end Context Contract v1 slice in Orchestrator."
  status: done
  oracle:
    signal: "Orchestrator produces a compact context bundle for ai-stock-analyst, shows the selected-source preview during preflight, persists ContextReceiptV1 in the run record, and Kit smoke fixtures pass."
    cadence: "after each Worker package and at final audit"
    final_proof: "TDD receipts plus passing targeted and Kit smoke commands, with a final audit mapping the observed bundle, preview, and persisted receipt to the original request."
  intake:
    original_request: "Реализовать поддержку Context Contract v1 внутри Orchestrator, используя TDD."
    interpreted_outcome: "Orchestrator safely obtains context from an external repository helper through a typed provider boundary, previews selected sources, and persists a v1 receipt."
    input_shape: existing_plan
    audience: "Orchestrator maintainers and users running ai-stock-analyst tasks"
    authority: requested
    proof_type: test
    completion_proof: "A fixture-backed end-to-end run demonstrates the compact bundle, preflight preview, persisted ContextReceiptV1, explicit failure or controlled fallback behavior, and passing Kit smoke fixtures."
    likely_misfire: "Adding types or a helper wrapper without proving the real preflight-to-run-record flow, safety exclusions, and failure semantics."
    blind_spots_considered:
      - "The existing helper contract, executable discovery, and compatibility behavior must be evidenced before implementation."
      - "Fallback must never bypass high-risk or secret-bearing path exclusions."
      - "Receipt persistence and preview must describe the exact selected sources, not a divergent recomputation."
    existing_plan_facts:
      - "Add ContextProvider."
      - "Add RepositoryContextHelperProvider that launches the existing helper as a separate process returning JSON."
      - "Add a safe FallbackContextProvider."
      - "Add context profile and maxSources to TaskInput."
      - "Preview selected sources during preflight."
      - "Persist ContextReceiptV1 in the run record."
      - "Do not read high-risk or secret-bearing paths."
      - "Do not embed Python context-selection logic in TypeScript."
      - "Timeout, invalid JSON, and contract mismatch must cause an explicit error or controlled fallback."
      - "Use TDD."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/context-router-v1/"
    command: "node C:/Users/Alexander Lozovoy/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.1/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/context-router-v1"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the user-provided vertical-slice plan against repository evidence and shape the largest safe TDD Worker package."
    inputs:
      - "User-provided Context Contract v1 plan and oracle"
      - "Repository implementation, tests, fixtures, and existing helper integration surfaces"
    constraints:
      - "Read-only."
      - "Preserve the requested vertical slice, but do not assume file locations or helper contract details."
      - "Identify existing red verification separately from goal-owned gates."
    expected_output:
      - "Evidence-backed architecture and test seam map"
      - "Validated contract and failure/fallback decisions"
      - "Exact allowed_files, verify, and stop_if for the first Worker package"
      - "Exact Kit smoke fixture command and classification of goal gates versus pre-existing red gates"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "Orchestrator is a compact monolith: TaskInput validation, preflight, run creation/persistence, and prompt construction are in server/index.ts; the visible launch flow is in src/App.tsx. ai-stock-analyst has a project-local read-only scripts/ai_context_helper.py with api-context JSON, explicit profile/max-sources, and default high-risk exclusions. Kit defines V1 as a normalized adapter projection over that legacy helper. Baselines are green. One bounded vertical Worker can add the provider seam, strict legacy/V1 guards, safe fixed-file fallback, exact preflight-to-run context reuse, persisted receipt, UI preview, docs, and tests."
      worker_package:
        objective: "Implement the complete Context Contract v1 provider-to-preflight-to-run-record vertical slice using TDD: add ContextProvider, RepositoryContextHelperProvider subprocess JSON integration, safe FallbackContextProvider, TaskInput contextProfile/maxSources, exact context reuse between preflight and run creation, prompt bundle attachment, visible selected-source preview, and persisted ContextReceiptV1."
        allowed_files:
          - server/index.ts
          - server/index.test.ts
          - src/App.tsx
          - src/styles.css
          - README.md
          - tasks.example.yaml
        verify:
          - "npm test"
          - "npm run check"
          - "npm run build"
          - "python \"D:/pet-projects/AI-assisted_System_Design_and_Agent_Memory_Kit/Agent Kit/kit/tools/context_contract_v1_oracle.py\" --format json"
        stop_if:
          - "Implementation needs files outside the approved write scope."
          - "The project-local helper executable or its api-context compatibility shape is absent or ambiguous."
          - "The adapter would need to copy Python selection or policy logic into TypeScript."
          - "Fallback would scan arbitrary files or could include high-risk/secret-bearing paths."
          - "Preflight preview, prompt bundle, and persisted receipt cannot reuse the same provider result."
          - "A goal-owned verification command fails twice after focused diagnosis."
      evidence:
        - "server/index.ts: TaskInput and Run types, validateQueue, preflight, createRun, persist, and buildPrompt"
        - "server/index.test.ts: existing node:test integration surface; baseline npm test passed 18/18"
        - "src/App.tsx: launch calls /api/preflight then /api/runs; visible preview must be added here"
        - "D:/pet-projects/ai-stock-analyst/scripts/ai_context_helper.py: api-context command, explicit --profile/--max-sources, JSON output, high-risk exclusions"
        - "D:/pet-projects/ai-stock-analyst/tests/test_ai_context_helper.py: helper contract and safety coverage"
        - "Kit context_contract_v1/README.md: V1 is a normalized projection over the legacy helper surface"
        - "Kit gate passed: context_contract_v1_oracle.py --format json, 5/5 cases and all examples passed"
      missing_evidence: []
      required_board_updates:
        - "Copy worker_package scope and gates to T002 and activate T002."
