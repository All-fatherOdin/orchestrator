version: 2

goal:
  title: "Workspace and Merge v1"
  slug: "workspace-merge-v1"
  kind: existing_plan
  tranche: "Complete Phase 3 contract, isolated workspace lifecycle, serialized merge, revalidation, cleanup, recovery, and final proof."
  status: done
  oracle:
    signal: "Windows-capable integration tests prove isolated attempt workspaces, serialized fresh-target merge, drift rejection/replan, bounded cleanup/recovery, and Phase 1/2 compatibility."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipt-backed Phase 3 invariant matrix plus passing npm run check, npm test, npm run build, and git diff --check."
  intake:
    original_request: "Приступай к Phase 3."
    interpreted_outcome: "Implement the complete Phase 3 Workspace and Merge lifecycle in Orchestrator."
    input_shape: existing_plan
    audience: "Orchestrator operator and managed repositories"
    authority: approved
    proof_type: test
    completion_proof: "A final Judge confirms the complete Phase 3 lifecycle from workspace creation through serialized merge and recovery using passing integration evidence."
    likely_misfire: "Stopping at contract documents or isolated worktree helpers without canonical attempt identity, merge serialization, recovery, and end-to-end proof."
    blind_spots_considered:
      - "Windows path, junction, lock, and cleanup semantics"
      - "Dirty targets and concurrent HEAD movement"
      - "Detached HEAD and branch ownership"
      - "100+ intermediate commits and deterministic replan"
      - "Crash/restart recovery and orphan cleanup"
      - "Destructive Git and publication authority"
      - "Legacy run and Phase 1/2 replay compatibility"
    existing_plan_facts:
      - "Phase 1 Change/Wave Foundation is implemented."
      - "Phase 2 Planning and Drift is implemented."
      - "Phase 3 must define and accept its contract before implementation."
      - "Worktree and branch policy remains undecided pending Windows evidence."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

