    receipt:
      result: done
      harness: goal_judge
      decision: approved
      full_outcome_complete: false
      rationale: "GO. T003 is approved as one contract-first package. The accepted boundary mandates isolated owned worktrees, fail-closed capability checks, serialized fresh-target merging, non-destructive cleanup, deterministic replan on target drift, explicit crash recovery, legacy replay compatibility, and executable Windows experiments."
      workspace_policy:
        - "Every Phase 3 attempt owns one dedicated Git worktree and local orchestrator/attempt/<runId>/<attemptId> branch; no shared-worktree or branchless fallback."
        - "Provisioning fails closed unless Git capability, normalized owned-root containment, target cleanliness, exact refs, and required locks are proven."
        - "Automatic mutation requires canonical attempt identity, ownership marker, repository identity, exact branch ref and HEAD, and containment; junction/reparse escapes are rejected."
      canonical_state:
        - "Atomically persisted run.json is canonical current state; immutable change-control events are canonical transition history."
        - "WorkspaceAttemptV1, MergeRequestV1, and MergeReceiptV1 are the versioned canonical Phase 3 records."
        - "Git refs, worktree metadata, lock files, directories, and markers are observed evidence, not alternate state."
      merge_policy:
        - "Hold one exclusive repository-identity plus target-ref lease from fresh-target validation through apply, verification, commit, receipt persistence, or safe abort."
        - "Any target movement transitions the request to replan_required; v1 does not auto-rebase, merge-forward, cherry-pick, or refresh acceptance criteria."
        - "Integrate exact sealed source SHA with git merge --no-ff --no-commit, run recorded verification, and create one identified merge commit."
        - "A 100+ commit attempt is one ancestry-preserving merge; conflict or target movement requires replan."
      authority:
        automatic:
          - "Create the recorded attempt branch and worktree."
          - "Write only in the owned attempt worktree."
          - "Non-force remove a clean owned worktree and delete a merged branch with git branch -d."
          - "Abort an owned in-progress merge only when all canonical identities and fingerprints match."
        forbidden_without_human:
          - "git reset --hard, git clean, git branch -D, git worktree remove --force, global git worktree prune, deleting unmerged branches, discarding files, force-updating refs, and remote publication."
      recovery:
        - "Bounded idempotent cleanup retains artifacts on contention, dirtiness, stale metadata, or ownership mismatch and enters recovery_pending or quarantined."
        - "Crash recovery may requeue an unchanged target, safely abort an exactly owned merge, or finalize an already-created identified merge commit."
        - "Any other target movement requires replan; conflicting evidence quarantines for human action."
      compatibility: "Phase 3 records are optional versioned extensions for legacy Phase 1/2 records. Missing, partial, unknown-version, or disagreeing Phase 3 evidence fails closed and never implies ownership."
      required_windows_proof:
        - "Temporary Git repos cover spaced/long paths, case-fold containment, junction escapes, dirty preservation, cleanup contention, stale metadata, crash points, dead locks, and 100+ commit merge/replan."
        - "Unsupported privileges must fail closed explicitly rather than silently skip invariants."
      missing_evidence:
