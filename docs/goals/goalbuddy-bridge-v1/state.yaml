# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "GoalBuddy Bridge V1"
  slug: "goalbuddy-bridge-v1"
  kind: existing_plan
  tranche: "Validate and deliver one TDD vertical slice from read-only GoalBuddy state selection through Orchestrator preview/run to a separate receipt file."
  status: done
  oracle:
    signal: "A GoalBuddy card passes state.yaml -> preview -> run -> receipt without manual copying or changing the GoalBuddy board."
    cadence: "after the Worker package and at final audit"
    final_proof: "Automated evidence covers exact mapping, one-active validation, existing run safeguards, persistent goal/task/repo/run linkage, separate GoalReceiptEnvelopeV1 JSON, and unchanged source state.yaml."
  intake:
    original_request: "Prepare goalbuddy-bridge-v1 with a read-only first slice, the supplied mapping and constraints, TDD, and the state.yaml -> preview -> run -> receipt oracle."
    interpreted_outcome: "Bridge exactly one active GoalBuddy task into the existing Orchestrator preview/run path and a separate receipt artifact without mutating or advancing GoalBuddy state."
    input_shape: existing_plan
    audience: "Orchestrator operator using GoalBuddy"
    authority: requested
    proof_type: test
    completion_proof: "Tests and a runnable fixture prove the complete automatic flow while the selected GoalBuddy state.yaml remains unchanged."
    likely_misfire: "Implementing a second scheduler, bypassing existing Git and path safeguards, or proving parsing without the real preview/run/receipt flow."
    blind_spots_considered:
      - "Zero or multiple active tasks and malformed board input"
      - "Stable goal/task/repo/run identity and receipt location"
      - "Failed or cancelled runs and receipt semantics"
      - "Path normalization and allowedPaths compatibility"
      - "Byte/content immutability proof for the selected state.yaml"
    existing_plan_facts:
      - "First integration slice is read-only toward the selected GoalBuddy state.yaml."
      - "objective maps to TaskInput title and prompt."
      - "allowed_files maps to allowedPaths."
      - "verify maps to task verification commands."
      - "stop_if maps to execution guards."
      - "GoalBuddy task id maps to external task id."
      - "Persist goal/task/repo/run linkage and emit GoalReceiptEnvelopeV1 as a separate JSON file after execution."
      - "Do not choose the next GoalBuddy task or create commits automatically."
      - "Reuse existing Git lock, status, diff, checkpoint, and allowedPaths behavior."
      - "Use TDD."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/goalbuddy-bridge-v1/"
    command: "node C:/Users/Alexander Lozovoy/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.1/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/goalbuddy-bridge-v1"

