version: 2

goal:
  title: "Change Control Foundation Execution v1"
  slug: "change-control-foundation-execution-v1"
  kind: existing_plan
  tranche: "Archive stale artifacts, publish the branch, execute the two-task foundation queue, and audit the result."
  status: active
  oracle:
    signal: "Both exact queue tasks are accepted with scope compliance; focused and full tests prove deterministic change ledger and wave dispatch behavior."
    cadence: "after environment preparation, after the queue run, and at final audit"
    final_proof: "Archive path, remote ref, canonical run receipt, diff audit, npm run check, npm test, git diff --check, and full_outcome_complete: true."
  intake:
    original_request: "сделай 1-3 потом аудит"
    interpreted_outcome: "Prepare the environment, publish the branch, execute the existing foundation queue, and audit the implementation."
    input_shape: existing_plan
    audience: "Orchestrator owner and maintainers"
    authority: approved
    proof_type: test
    completion_proof: "A completed two-task run plus a final evidence-backed audit."
    likely_misfire: "Stopping after push or queue launch rather than accepted implementation and audit."
    blind_spots_considered:
      - "Old Desktop server binary is not the source revision being tested."
      - "Stale runtime directories contain recoverable run records."
      - "The queue file is intentionally ignored by Git."
    existing_plan_facts:
      - "Archive or otherwise resolve local service artifacts."
      - "Push cdx/agent-memory-foundation-v1."
      - "Run queues/change-control-foundation-v1.yaml."
      - "Audit after execution."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/change-control-foundation-execution-v1/"
