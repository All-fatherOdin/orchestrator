        Architecture and behavior:

        - [`server/index.ts`](D:\pet-projects\orchestrator\server\index.ts:1048) is the integration point: it imports a single active GoalBuddy card, maps `allowed_files`, `verify`, and `stop_if` into `TaskInput`, snapshots `state.yaml` with SHA-256, runs work, writes a receipt, and only synchronizes if the source state is unchanged.
