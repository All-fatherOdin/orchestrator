project:
  name: ai-stock-analyst
  path: D:\pet-projects\ai-stock-analyst

limits:
  taskTimeoutMinutes: 20
  reviewerTimeoutMinutes: 20
  maxTaskRetries: 0
  maxParallelTasks: 1

git:
  checkpointCommits: false

tasks:
  - key: audit-core-source-acceptance-repair
    title: Audit the local acceptance repair and record a gated verdict
    prompt: >-
      Read-only audit of the retained three-request documentation qualification
      plus its local acceptance repair. Do not access network, tokens, secrets,
      accounts, data endpoints, brokers, or external services. Verify the
      supersession receipt makes every raw UNRESOLVED source effectively NO_GO;
      execute the focused tests and offline evidence verifier; confirm the
      verifier rejects an extra source directory and custody counter tampering;
      and confirm the evidence still represents exactly three frozen requests.
      Inspect the allowed receipt path before any write. If the receipt already
      exists, treat it as an immutable retained artifact: do not rewrite it,
      and verify its schema_version
      post_dividend_drift_core_source_documentation_acceptance_receipt_v1,
      audit_outcome APPROVED, network_accessed false, token_or_secret_accessed
      false, exact three effective NO_GO dispositions, and original frozen
      contract SHA-256. If the receipt is absent, create it if and only if all
      checks pass with those exact values. Then run the acceptance gate. If any
      finding remains, do not create or modify the receipt and exit nonzero:
      CHANGES_REQUESTED must fail the task rather than be reported as a
      successful audit.
    model: sol
    minModel: sol
    effort: high
    allowedPaths:
      - docs/owner_only/evidence/post_dividend_drift_core_source_documentation_qualification_v1/acceptance_audit_receipt.json
    verificationCommands:
      - >-
        .\.venv\Scripts\python.exe -m pytest -q
        tests\test_post_dividend_drift_core_source_documentation_qualification.py
        -p no:cacheprovider
        --basetemp="$env:TEMP\orchestrator-core-source-acceptance-audit-$PID"
      - >-
        .\.venv\Scripts\python.exe
        scripts\post_dividend_drift_core_source_documentation_qualification.py
        --contract docs\owner_only\contracts\post_dividend_drift_core_source_documentation_qualification_v1.json
        --verify-root docs\owner_only\evidence\post_dividend_drift_core_source_documentation_qualification_v1
      - >-
        .\.venv\Scripts\python.exe
        scripts\post_dividend_drift_core_source_documentation_acceptance_gate.py
        --contract docs\owner_only\contracts\post_dividend_drift_core_source_documentation_qualification_v1.json
        --receipt docs\owner_only\evidence\post_dividend_drift_core_source_documentation_qualification_v1\acceptance_audit_receipt.json
      - git diff --check
    executionGuards:
      - "No network, token, secret, account, market, data endpoint, broker, order, or executor work."
      - "The audit receipt is immutable if present; it is create-new only when absent and every check passes."
      - "Any CHANGES_REQUESTED outcome must not create or modify the receipt and must fail the task."
    contextProfile: review
    maxSources: 8
  - key: review-gated-core-source-acceptance
    title: Independently verify the gated acceptance receipt
    dependsOn:
      - audit-core-source-acceptance-repair
    prompt: >-
      Strictly read-only independent review. Run the acceptance gate and inspect
      its numbered source contract, supersession receipt, tests, and audit
      receipt. Approve only if the gate proves all three effective source
      decisions are NO_GO, exactly three evidence requests remain, and no
      network, credential, endpoint, integration, or trading authority exists.
      Reject rather than repair any defect. Do not access the network or edit.
    model: sol
    minModel: sol
    effort: high
    allowedPaths: []
    verificationCommands:
      - >-
        .\.venv\Scripts\python.exe -m pytest -q
        tests\test_post_dividend_drift_core_source_documentation_qualification.py
        -p no:cacheprovider
        --basetemp="$env:TEMP\orchestrator-core-source-acceptance-review-$PID"
      - >-
        .\.venv\Scripts\python.exe
        scripts\post_dividend_drift_core_source_documentation_acceptance_gate.py
        --contract docs\owner_only\contracts\post_dividend_drift_core_source_documentation_qualification_v1.json
        --receipt docs\owner_only\evidence\post_dividend_drift_core_source_documentation_qualification_v1\acceptance_audit_receipt.json
      - git diff --check
    executionGuards:
      - "Read-only: no network, token, secret, broker, account, endpoint, or edit."
      - "Reject if the machine gate is absent, bypassed, or reports a non-APPROVED audit."
    contextProfile: review
    maxSources: 8
