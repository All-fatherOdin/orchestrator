name: Проверки

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Подготовка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Подготовка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Поддержка длинных путей
        run: git config --global core.longpaths true
      - name: Установка зависимостей
        run: npm ci
      - name: Проверка типов
        run: npm run check
      - name: Испытания
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Первый полный проход завершился с ошибкой; выполняется один повтор."
            npm test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Сборка
        run: npm run build
      - name: Проверка пробелов
        run: git diff --check
