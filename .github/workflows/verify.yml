name: Проверки

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Подготовка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Подготовка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Поддержка длинных путей
        run: git config --global core.longpaths true
      - name: Установка зависимостей
        run: npm ci
      - name: Проверка типов
        run: npm run check
      - name: Agentic Stage 1 focused tests
        run: npm run test:stage1
      - name: Основные испытания
        run: >-
          npm exec tsx -- --test
          --test-skip-pattern "Phase 4 correlation is atomic across server processes|Orchestrator consumes its own bounded secondary-memory profile|MergeRequestV1 production target fencing has one cross-process winner"
          server/index.test.ts electron/lifecycle.test.cjs
      - name: Изолированные испытания Windows
        shell: pwsh
        run: |
          $tests = @(
            "Phase 4 correlation is atomic across server processes",
            "Orchestrator consumes its own bounded secondary-memory profile",
            "MergeRequestV1 production target fencing has one cross-process winner"
          )
          $failed = $false
          foreach ($testName in $tests) {
            $passed = $false
            for ($attempt = 1; $attempt -le 3; $attempt += 1) {
              npm exec tsx -- --test --test-name-pattern $testName server/index.test.ts
              if ($LASTEXITCODE -eq 0) {
                $passed = $true
                break
              }
              Write-Warning "Испытание '$testName': проход $attempt завершился с ошибкой."
            }
            if (-not $passed) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Сборка
        run: npm run build
      - name: Проверка пробелов
        run: git diff --check
