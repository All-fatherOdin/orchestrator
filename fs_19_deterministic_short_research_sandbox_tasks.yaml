# FS-19 deterministic SBER short research and verified sandbox validation queue.
#
# Owner-approved scope:
# - start with SBER while keeping an explicitly extensible universe contract;
# - T-Invest authenticated read-only and verified sandbox/test APIs are allowed;
# - commission, spread, slippage, borrow fee, dividends and forced-close stress
#   must be represented;
# - short risk limits must be stricter than the corresponding long limits and
#   several bounded combinations must be tested;
# - admission requires backtest, holdout/walk-forward and sandbox reconciliation;
# - production write endpoints and every real-money short trade remain forbidden.
project:
  name: ai-stock-analyst — FS-19 deterministic short research and sandbox validation
  path: D:\pet-projects\ai-stock-analyst

limits:
  taskTimeoutMinutes: 120
  reviewerTimeoutMinutes: 25
  maxTaskRetries: 1
  maxParallelTasks: 1

git:
  checkpointCommits: false

tasks:
  - key: fs19-t00-queue-bootstrap
    title: FS19-T00 — Create the canonical deterministic short queue
    prompt: |
      Work only in D:\pet-projects\ai-stock-analyst. Read AGENTS.md,
      docs/NEXT_STEPS.md, docs/source_of_truth_hierarchy.md,
      docs/context_packs/current_status.md, the automated-development protocol,
      the final-product plan and completed/current FS-15 through FS-18 records.
      Create
      docs/owner_only/plans/fs_19_deterministic_short_research_sandbox_queue_2026_07_13.md
      matching this YAML with FS19-T00 through FS19-T12, dependencies, outputs,
      checks, stop conditions and commit messages.

      Encode owner decisions exactly: SBER first with an extensible universe
      contract; T-Invest read-only and verified sandbox/test APIs allowed; full
      short cost and corporate-action treatment; stricter asymmetric short risk
      limits tested through bounded combinations; and admission only after
      backtest, untouched holdout/walk-forward and sandbox reconciliation.
      Credentials may be consumed only through the approved secret/environment
      boundary and must never be printed, persisted or committed. Production
      order writes, real-account mutation, real-money shorting, inference of
      borrow availability and LLM order decisions remain denied.

      Run documentation checks and git diff --check, self-review, mark only
      FS19-T00 done, commit "docs: create FS-19 deterministic short queue",
      push the current branch, and stop.
    model: auto
    minModel: terra
    effort: medium
    timeoutMinutes: 50
    allowedPaths:
      - docs/owner_only/plans/fs_19_deterministic_short_research_sandbox_queue_2026_07_13.md
    resources: [fs19-queue-state]

  - key: fs19-t01-short-universe-evidence-contract
    title: FS19-T01 — Freeze the SBER-first short universe and evidence contract
    dependsOn: [fs19-t00-queue-bootstrap]
    prompt: |
      Execute only FS19-T01. Freeze a versioned short-research universe contract
      with SBER as the sole active member and a deterministic extension process
      for later instruments. Define stable instrument identity, exchange/class,
      liquidity and data prerequisites, shortability evidence fields, evidence
      timestamp/expiry, provider provenance, side-specific status and reason
      codes. An added instrument must pass the same contract and may not inherit
      SBER evidence.

      Pre-register PASS_SHORT_RESEARCH_INPUT, DEFER_SHORT_EVIDENCE and
      REJECT_SHORT_INPUT outcomes. Distinguish current shortability from
      historical borrow availability; neither may be inferred from the other.
      Produce
      docs/owner_only/plans/fs_19_sber_short_universe_evidence_contract_2026_07_13.md.
      Run docs checks, self-review, update only FS19-T01, commit
      "docs: freeze FS-19 short universe contract", push, and stop.
    model: auto
    minModel: terra
    effort: high
    timeoutMinutes: 70
    allowedPaths:
      - docs/owner_only/plans/fs_19_sber_short_universe_evidence_contract_2026_07_13.md
      - docs/owner_only/plans/fs_19_deterministic_short_research_sandbox_queue_2026_07_13.md
    resources: [fs19-queue-state, short-universe-contract]

  - key: fs19-t02-tinvest-shortability-readonly
    title: FS19-T02 — Acquire and normalize T-Invest read-only shortability evidence
    dependsOn: [fs19-t01-short-universe-evidence-contract]
    prompt: |
      Execute only FS19-T02. Inspect official/current T-Invest client contracts
      already available to the repository and implement a bounded authenticated
      read-only acquisition path for SBER shortability, instrument identity,
      margin attributes and risk parameters that the API actually exposes. Also
      probe verified sandbox/test capability without submitting an order.
      Normalize sanitized evidence with retrieval time, environment identity,
      provenance, schema/version and digest. Record unsupported and unavailable
      fields explicitly. Never guess borrow inventory, locate confirmation,
      historical availability or borrow fee.

      Load credentials only through the approved secret boundary, redact all
      diagnostics and hard-block write-capable production routes. Add mocked
      tests plus an optional bounded integration smoke test that skips safely
      when credentials/network are absent. Produce a paired plan/evidence record.
      Run required checks, self-review, update only FS19-T02, commit
      "feat: acquire FS-19 read-only shortability evidence", push, and stop.
    model: terra
    effort: high
    allowedPaths:
      - src/services
      - src/owner_only_sandbox
      - scripts
      - tests
      - data/processed/fs19
      - docs/owner_only/evidence/fs_19_tinvest_sber_shortability_2026_07_13.md
      - docs/owner_only/evidence/fs_19_tinvest_sber_shortability_2026_07_13.json
      - docs/owner_only/plans/fs_19_tinvest_shortability_readonly_2026_07_13.md
      - docs/owner_only/plans/fs_19_deterministic_short_research_sandbox_queue_2026_07_13.md
    resources: [fs19-queue-state, tinvest-readonly-api, short-evidence]

  - key: fs19-t03-short-data-sufficiency-gate
    title: FS19-T03 — Evaluate short-specific data sufficiency without inference
    dependsOn: [fs19-t02-tinvest-shortability-readonly]
    prompt: |
      Execute only FS19-T03. Reconcile the frozen SBER market dataset, corporate
      actions and FS19-T02 evidence against every short-specific input required
      for research and sandbox work. Classify current shortability, historical
      borrow availability, borrow fee history, margin/risk parameters, dividends,
      splits, suspensions, price limits and forced-close evidence as observed,
      scenario-only, missing or not provided. Do not manufacture a historical
      borrow series from today's flag.

      Define which work may proceed as sensitivity research and which admission
      gates remain blocked. Emit PASS_RESEARCH_ONLY, PASS_SANDBOX_PREREQUISITES,
      DEFER_MISSING_SHORT_DATA or REJECT_SHORT_DATA with exact reasons. Produce
      Markdown and JSON evidence. Run checks, self-review, update only FS19-T03,
      commit "test: gate FS-19 short data sufficiency", push, and stop.
    model: auto
    minModel: terra
    effort: high
    timeoutMinutes: 75
    allowedPaths:
      - docs/owner_only/evidence/fs_19_short_data_sufficiency_2026_07_13.md
      - docs/owner_only/evidence/fs_19_short_data_sufficiency_2026_07_13.json
      - docs/owner_only/plans/fs_19_deterministic_short_research_sandbox_queue_2026_07_13.md
    resources: [fs19-queue-state, short-evidence]

  - key: fs19-t04-short-cost-corporate-action-model
    title: FS19-T04 — Implement the complete short cost and corporate-action model
    dependsOn: [fs19-t03-short-data-sufficiency-gate]
    prompt: |
      Execute only FS19-T04. Extend the deterministic replay cost model for the
      short side with evidenced commission, spread, slippage, borrow fee accrual,
      dividend compensation, corporate actions and configurable forced-close
      penalties. Separate observed values from conservative scenario values and
      bind every run to the exact cost-config digest. Missing borrow cost must
      never default to zero. Test base, adverse and severe stress scenarios,
      non-trading days, dividend boundaries and early forced close.

      Preserve long behavior and add regression tests. Produce the short-cost
      model contract and scenario evidence. Run focused/full required checks,
      self-review, update only FS19-T04, commit
      "feat: add FS-19 short cost model", push, and stop.
    model: terra
    effort: high
    allowedPaths:
      - src/owner_only_sandbox
      - scripts
      - tests
      - docs/owner_only/plans/fs_19_short_cost_model_2026_07_13.md
      - docs/owner_only/evidence/fs_19_short_cost_scenarios_2026_07_13.json
      - docs/owner_only/plans/fs_19_deterministic_short_research_sandbox_queue_2026_07_13.md
    resources: [fs19-queue-state, replay-engine, short-cost-model]

  - key: fs19-t05-asymmetric-short-risk
    title: FS19-T05 — Implement stricter asymmetric short risk controls
    dependsOn: [fs19-t04-short-cost-corporate-action-model]
    prompt: |
      Execute only FS19-T05. Define and implement short-specific position, gross
      exposure, loss, drawdown, gap, hard-stop, stale-shortability and forced-
      close controls. Every candidate short limit must be strictly no looser than
      the corresponding long limit, with smaller position/exposure budgets and
      explicit unlimited-loss protection. Generate several bounded risk-limit
      combinations for research; do not choose values by maximizing return.
      Unknown environment, expired shortability, missing borrow cost or corporate
      action uncertainty must fail closed and latch the stop where applicable.

      Add deterministic boundary, gap, restart, duplicate-intent and stale-input
      tests. Produce the risk contract and matrix. Run checks, self-review,
      update only FS19-T05, commit "feat: add FS-19 asymmetric short risk",
      push, and stop.
    model: terra
    effort: high
    allowedPaths:
      - src/owner_only_sandbox
      - scripts
      - tests
      - docs/owner_only/plans/fs_19_asymmetric_short_risk_contract_2026_07_13.md
      - docs/owner_only/evidence/fs_19_short_risk_matrix_2026_07_13.json
      - docs/owner_only/plans/fs_19_deterministic_short_research_sandbox_queue_2026_07_13.md
    resources: [fs19-queue-state, short-risk]

  - key: fs19-t06-deterministic-short-candidates
    title: FS19-T06 — Implement deterministic SBER short candidates and benchmark
    dependsOn: [fs19-t05-asymmetric-short-risk]
    prompt: |
      Execute only FS19-T06. Implement a small preregistered family of causal,
      deterministic SBER short candidates using only completed-bar inputs and
      existing validated data. Include simple short/no-short benchmarks and at
      least distinct trend, breakdown and mean-reversion hypotheses where data
      supports them. Each candidate must declare entry, cover, timeout, risk,
      shortability and corporate-action behavior. No LLM, news interpretation,
      look-ahead, same-bar fill assumption or silent long-to-short mirroring.

      Add unit tests for causality, reproducibility, no-action, cover and blocked
      cases. Run checks, self-review, update only FS19-T06, commit
      "feat: add FS-19 deterministic short candidates", push, and stop.
    model: terra
    effort: high
    allowedPaths:
      - src/owner_only_sandbox
      - scripts
      - tests
      - docs/owner_only/plans/fs_19_deterministic_short_candidates_2026_07_13.md
      - docs/owner_only/plans/fs_19_deterministic_short_research_sandbox_queue_2026_07_13.md
    resources: [fs19-queue-state, short-strategies, replay-engine]

  - key: fs19-t07-bounded-short-parameter-search
    title: FS19-T07 — Screen bounded strategy and risk parameter combinations
    dependsOn: [fs19-t06-deterministic-short-candidates]
    prompt: |
      Execute only FS19-T07. Generate a finite preregistered grid combining the
      candidate strategy parameters, stricter risk-limit combinations and base/
      adverse/severe costs. Keep the search budget fixed, preserve all rejected
      configurations and prevent optimization on holdout data. Rank development
      results lexicographically: controlled drawdown and positive after-cost
      stability first, maximum return second. Enforce minimum trade/sample and
      concentration gates; no-trade is not a successful strategy.

      Emit a reproducible manifest, full result table and rejection reasons.
      Run repeated-run determinism and regression checks, self-review, update
      only FS19-T07, commit "test: screen FS-19 short parameters", push, and stop.
    model: terra
    effort: high
    timeoutMinutes: 120
    allowedPaths:
      - src/owner_only_sandbox
      - scripts
      - tests
      - data/processed/fs19
      - docs/owner_only/evidence/fs_19_short_parameter_screen_2026_07_13.md
      - docs/owner_only/evidence/fs_19_short_parameter_screen_2026_07_13.json
      - docs/owner_only/plans/fs_19_deterministic_short_research_sandbox_queue_2026_07_13.md
    resources: [fs19-queue-state, short-strategies, replay-engine]

  - key: fs19-t08-holdout-walkforward-robustness
    title: FS19-T08 — Validate untouched holdout, walk-forward and short stresses
    dependsOn: [fs19-t07-bounded-short-parameter-search]
    prompt: |
      Execute only FS19-T08. Freeze survivors before opening untouched holdout.
      Run holdout and walk-forward validation plus regime, gap, dividend,
      suspension, liquidity, borrow-cost, unavailable-short and forced-close
      stresses. Report after-cost return, drawdown, turnover, trade count,
      concentration, parameter-neighborhood stability and failure reasons.
      Historical shortability gaps must remain limitations and cannot be
      converted into positive evidence by sensitivity tests.

      Produce paired Markdown/JSON validation evidence and a deterministic
      PASS_SHORT_RESEARCH, DEFER_SHORT_RESEARCH or REJECT_SHORT_RESEARCH result.
      Run required checks, self-review, update only FS19-T08, commit
      "test: validate FS-19 short robustness", push, and stop.
    model: terra
    effort: high
    timeoutMinutes: 120
    allowedPaths:
      - src/owner_only_sandbox
      - scripts
      - tests
      - data/processed/fs19
      - docs/owner_only/evidence/fs_19_short_holdout_walkforward_2026_07_13.md
      - docs/owner_only/evidence/fs_19_short_holdout_walkforward_2026_07_13.json
      - docs/owner_only/plans/fs_19_deterministic_short_research_sandbox_queue_2026_07_13.md
    resources: [fs19-queue-state, short-strategies, replay-engine]

  - key: fs19-t09-common-basis-long-short-comparison
    title: FS19-T09 — Compare admitted long and short evidence on a common basis
    dependsOn: [fs19-t08-holdout-walkforward-robustness]
    prompt: |
      Execute only FS19-T09. Compare the FS-16 deterministic long evidence and
      surviving FS-19 short evidence only on overlapping SBER periods using the
      same market-data cutoffs, benchmark definitions, commission/spread/slippage
      assumptions and compatible risk reporting. Keep borrow/dividend/forced-
      close costs side-specific. Report standalone long, standalone short and a
      hypothetical combined research view without inferring portfolio admission.
      Preserve differences in sample size and evidence quality.

      Produce a paired comparison artifact with no winner when common-basis
      evidence is insufficient. Run checks, self-review, update only FS19-T09,
      commit "docs: compare FS-19 long and short evidence", push, and stop.
    model: auto
    minModel: terra
    effort: high
    timeoutMinutes: 80
    allowedPaths:
      - docs/owner_only/evidence/fs_19_long_short_common_basis_comparison_2026_07_13.md
      - docs/owner_only/evidence/fs_19_long_short_common_basis_comparison_2026_07_13.json
      - docs/owner_only/plans/fs_19_deterministic_short_research_sandbox_queue_2026_07_13.md
    resources: [fs19-queue-state, strategy-comparison]

  - key: fs19-t10-verified-sandbox-short-lifecycle
    title: FS19-T10 — Validate the complete short lifecycle in verified sandbox
    dependsOn: [fs19-t09-common-basis-long-short-comparison]
    prompt: |
      Execute only FS19-T10. Proceed only when FS19-T08 passed and current
      evidence proves an isolated non-production T-Invest sandbox/test
      environment with supported short semantics. Extend the sandbox adapter and
      reconciliation harness for bounded open-short, partial fill, cover, cancel,
      reject, expiry, duplicate, restart and unresolved-state scenarios. Recheck
      shortability immediately before each test intent. Bind environment,
      strategy/config, cost/risk and correlation digests. Never fall back to a
      production URL or account and never submit a real-money order.

      If the sandbox does not faithfully support short orders, record
      DEFER_SANDBOX_UNSUPPORTED and validate only local simulated lifecycle
      semantics; do not label simulation as broker evidence. Add negative and
      optional bounded integration tests. Run checks, self-review, update only
      FS19-T10, commit "test: validate FS-19 sandbox short lifecycle", push,
      and stop.
    model: terra
    effort: high
    timeoutMinutes: 120
    allowedPaths:
      - src/owner_only_sandbox
      - scripts
      - tests
      - data/processed/fs19
      - docs/owner_only/evidence/fs_19_sandbox_short_lifecycle_2026_07_13.md
      - docs/owner_only/evidence/fs_19_sandbox_short_lifecycle_2026_07_13.json
      - docs/owner_only/plans/fs_19_deterministic_short_research_sandbox_queue_2026_07_13.md
    resources: [fs19-queue-state, tinvest-sandbox-api, short-reconciliation]

  - key: fs19-t11-short-admission-decision
    title: FS19-T11 — Decide deterministic short no-write or sandbox admission
    dependsOn: [fs19-t10-verified-sandbox-short-lifecycle]
    prompt: |
      Execute only FS19-T11. Recompute the frozen gates from FS19-T01 through
      FS19-T10 and emit exactly one result: ADMIT_SHORT_NO_WRITE_SANDBOX,
      DEFER_SHORT_MORE_EVIDENCE or REJECT_DETERMINISTIC_SHORT. Admission requires
      passing backtest, untouched holdout/walk-forward, robustness, current
      shortability and complete verified sandbox reconciliation. Scenario-only
      borrow history, unsupported sandbox behavior, stale evidence or unresolved
      lifecycle state must defer or reject as preregistered. Bind the exact SBER
      universe, strategy/config, dataset, cost/risk and evidence digests.

      Produce a machine-readable admission packet and owner-readable report.
      Admission grants only no-write/verified sandbox research authority and no
      production or real-money short authority. Run checks, self-review, update
      only FS19-T11, commit "docs: decide FS-19 short admission", push, and stop.
    model: auto
    minModel: terra
    effort: high
    timeoutMinutes: 80
    allowedPaths:
      - docs/owner_only/evidence/fs_19_deterministic_short_admission_2026_07_13.md
      - docs/owner_only/evidence/fs_19_deterministic_short_admission_2026_07_13.json
      - docs/owner_only/plans/fs_19_deterministic_short_research_sandbox_queue_2026_07_13.md
    resources: [fs19-queue-state, strategy-admission]

  - key: fs19-t12-llm-comparison-handoff
    title: FS19-T12 — Close deterministic short scope and define the LLM comparison handoff
    dependsOn: [fs19-t11-short-admission-decision]
    prompt: |
      Execute only FS19-T12. Summarize FS-19 without changing its admission
      outcome. Define the next isolated LLM research queue on a common basis with
      admitted deterministic long and, only if admitted, deterministic short:
      same SBER dataset snapshots, periods, costs, risk limits, benchmarks and
      metrics. Require frozen model/provider/version, prompts, tool contract,
      input snapshots, reproducibility, latency/token cost, invalid-action and
      hallucination controls, and deterministic fallback. LLM output may be used
      only in backtest, read-only or verified sandbox/test environments and may
      never directly place a real order.

      Produce
      docs/owner_only/plans/fs_19_llm_strategy_comparison_handoff_2026_07_13.md.
      Mark the queue complete as implementation/research work while preserving
      any time- or evidence-dependent defer state. Run documentation checks and
      git diff --check, self-review, update FS19-T12/final state, commit
      "docs: hand off FS-19 to isolated LLM research", push, and stop.
    model: auto
    minModel: terra
    effort: medium
    timeoutMinutes: 65
    allowedPaths:
      - docs/owner_only/plans/fs_19_llm_strategy_comparison_handoff_2026_07_13.md
      - docs/owner_only/plans/fs_19_deterministic_short_research_sandbox_queue_2026_07_13.md
    resources: [fs19-queue-state]
