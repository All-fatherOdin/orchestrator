# FS-16 deterministic long-only strategy research and sandbox admission queue.
#
# Owner decisions encoded here:
# - deterministic strategies only; no LLM-generated decisions in this queue;
# - bounded search must retain several potentially viable parameter sets;
# - primary objective is stable after-cost return with controlled drawdown;
# - maximum return is secondary;
# - long-only is evaluated first; short is mandatory in a later queue;
# - automatic admission is allowed only for no-write/verified sandbox use;
# - real-money orders and production broker writes remain forbidden.
project:
  name: ai-stock-analyst — FS-16 deterministic strategy research and admission
  path: D:\pet-projects\ai-stock-analyst

limits:
  taskTimeoutMinutes: 120
  reviewerTimeoutMinutes: 25
  maxTaskRetries: 1
  maxParallelTasks: 1

git:
  # Every repository task follows the repository queue protocol and performs
  # its own reviewed commit and push.
  checkpointCommits: false

tasks:
  - key: fs16-t00-queue-bootstrap
    title: FS16-T00 — Create the canonical deterministic strategy queue
    prompt: |
      Work only in D:\pet-projects\ai-stock-analyst. Read AGENTS.md,
      docs/NEXT_STEPS.md, docs/source_of_truth_hierarchy.md,
      docs/context_packs/current_status.md, and
      docs/owner_only/plans/codex_task_queue_automated_development_rules_2026_07_09.md
      completely before acting. Also read the final-product implementation plan,
      the canonical FS-15 queue and all completed FS-15 evidence.

      Create
      docs/owner_only/plans/fs_16_deterministic_strategy_research_admission_queue_2026_07_13.md
      as the canonical repository queue matching this YAML. Record FS16-T00
      through FS16-T11 with dependencies, outputs, acceptance criteria, checks,
      stop conditions and commit messages. Encode the owner's decisions exactly:
      deterministic strategies without LLM decisions; bounded parameter search
      retaining multiple viable combinations; stable after-cost return with
      controlled drawdown as the primary objective and maximum return as a
      secondary objective; long-only now; mandatory later short validation;
      automatic admission only to no-write or verified sandbox/test use.

      The queue must deny production broker writes, real-money submit/cancel/
      replace, broker-account mutation, live readiness and automatic inference
      from sandbox to live. Read-only APIs and proven isolated sandbox/test APIs
      are allowed. Credentials must stay inside approved secret/environment
      boundaries and never enter logs, artifacts or commits. FS-15 dataset
      readiness is a hard prerequisite: if its final packet is absent, invalid,
      stale or blocked, FS16-T01 must stop rather than weaken the data gate.

      Run documentation checks and git diff --check, self-review, mark only
      FS16-T00 done, commit with message
      "docs: create FS-16 deterministic strategy queue", push the current
      branch, and stop.
    model: auto
    minModel: terra
    effort: medium
    timeoutMinutes: 50
    allowedPaths:
      - docs/owner_only/plans/fs_16_deterministic_strategy_research_admission_queue_2026_07_13.md
    resources: [fs16-queue-state]

  - key: fs16-t01-research-contract
    title: FS16-T01 — Pre-register strategy research and admission criteria
    dependsOn: [fs16-t00-queue-bootstrap]
    prompt: |
      Execute only FS16-T01 from the canonical FS-16 queue. Read the required
      startup set, FS-15 readiness packet and dataset manifest, replay-admission
      rejection evidence, existing strategy registry/replay contracts and the
      canonical FS-16 queue first. Stop if the FS-15 dataset is not valid and
      sufficiently fresh for the declared test period.

      Before running candidate backtests, create a pre-registered deterministic
      research contract. Define the inherited FS-15 universe/timeframe/period,
      train-validation-holdout and walk-forward boundaries, cash and buy-and-hold
      benchmarks, stable after-cost risk-adjusted performance as the primary
      lexicographic objective, controlled drawdown as a hard guardrail, and
      maximum after-cost return only as a secondary tie-breaker. Select explicit
      numeric admission thresholds for minimum sample size/trades, positive
      holdout performance, drawdown, parameter stability, cross-instrument P&L
      concentration, walk-forward consistency and increased-cost sensitivity.
      Justify thresholds from the available dataset and product contour without
      inspecting future candidate results. Freeze the cost scenarios and forbid
      changing criteria after seeing holdout outcomes.

      Require several distinct parameter configurations to survive screening:
      target at least three non-near-duplicate shortlisted configurations overall
      and evaluate every shortlisted configuration on untouched holdout data.
      If data cannot support pre-registered thresholds, record BLOCKED rather
      than inventing statistical confidence. LLM strategies and short positions
      are out of this queue, with mandatory later handoff retained.

      Produce
      docs/owner_only/plans/fs_16_deterministic_strategy_research_contract_2026_07_13.md.
      Run documentation checks and git diff --check, self-review, update only
      FS16-T01, commit with message
      "docs: preregister FS-16 strategy admission criteria", push, and stop.
    model: auto
    minModel: terra
    effort: high
    timeoutMinutes: 75
    allowedPaths:
      - docs/owner_only/plans/fs_16_deterministic_strategy_research_contract_2026_07_13.md
      - docs/owner_only/plans/fs_16_deterministic_strategy_research_admission_queue_2026_07_13.md
    resources: [fs16-queue-state, strategy-research-contract]

  - key: fs16-t02-backtest-runner
    title: FS16-T02 — Productize the deterministic backtest runner
    dependsOn: [fs16-t01-research-contract]
    prompt: |
      Execute only FS16-T02 from the canonical FS-16 queue. Read the completed
      FS-15 data artifacts and FS16-T01 research contract. Inspect and reuse the
      existing backtester, historical replay, fixed-config replay, registry and
      diagnostics modules instead of creating a parallel framework.

      Implement one deterministic, repeatable backtest entrypoint that consumes
      only a validated frozen FS-15 dataset manifest and registered strategy
      configuration. Enforce causal signal timing, explicit execution timing,
      no look-ahead, deterministic ordering, reproducible run identifiers and
      complete provenance. Emit per-trade and aggregate machine-readable results
      suitable for later cost, holdout and walk-forward stages. Fail closed on
      manifest, schema, digest, timeframe, universe or strategy mismatch. Add
      focused unit/CLI tests, including look-ahead and reproducibility failures.

      No LLM calls, short positions, production broker calls or real orders are
      allowed. Run focused tests and repository-required checks, self-review,
      update only FS16-T02, commit with message
      "feat: productize FS-16 deterministic backtest runner", push, and stop.
    model: terra
    effort: high
    allowedPaths:
      - src/backtester.py
      - src/owner_only_sandbox
      - scripts
      - tests
      - docs/owner_only/plans/fs_16_deterministic_strategy_research_admission_queue_2026_07_13.md
      - docs/owner_only/plans/fs_16_deterministic_backtest_runner_2026_07_13.md
    resources: [fs16-queue-state, strategy-backtest]

  - key: fs16-t03-cost-model
    title: FS16-T03 — Add explicit commission, spread and slippage scenarios
    dependsOn: [fs16-t02-backtest-runner]
    prompt: |
      Execute only FS16-T03. Implement the pre-registered deterministic cost
      model in the FS-16 backtest path. It must separately account for commission,
      bid/ask spread proxy and slippage, report gross and net results, and support
      the frozen base and increased-cost stress scenarios without silently using
      zero costs. Validate units, sign, turnover application and round-trip
      treatment. Missing or incompatible cost evidence must block admission.
      Add focused tests for zero-trade, buy/sell round-trip, high-turnover and
      stressed-cost cases. Do not add real broker calls.

      Run required checks, self-review, update only FS16-T03, commit with message
      "feat: add FS-16 deterministic trading cost model", push, and stop.
    model: terra
    effort: high
    allowedPaths:
      - src/backtester.py
      - src/owner_only_sandbox
      - scripts
      - tests
      - docs/owner_only/plans/fs_16_deterministic_strategy_research_admission_queue_2026_07_13.md
      - docs/owner_only/plans/fs_16_trading_cost_model_2026_07_13.md
    resources: [fs16-queue-state, strategy-backtest]

  - key: fs16-t04-candidate-strategies
    title: FS16-T04 — Implement deterministic long-only candidates and benchmarks
    dependsOn: [fs16-t03-cost-model]
    prompt: |
      Execute only FS16-T04. Implement or normalize three deterministic long-only
      candidate families under the common strategy interface: trend following,
      volatility breakout, and mean reversion. Reuse the existing ATR14 lane
      where appropriate but do not treat its prior rejected configuration as
      admitted. Add explicit cash and buy-and-hold benchmarks. Every strategy
      must have a frozen versioned configuration schema, causal inputs, position
      state rules, exit rules and unsupported-state handling. No LLM-derived
      feature, prompt, discretionary override, short position or order authority
      is allowed.

      Add focused tests for deterministic output, warm-up, missing data, entry/
      exit timing and no-look-ahead behavior. Run required checks, self-review,
      update only FS16-T04, commit with message
      "feat: add FS-16 deterministic long strategy candidates", push, and stop.
    model: terra
    effort: high
    allowedPaths:
      - src/owner_only_sandbox
      - src/backtester.py
      - scripts
      - tests
      - docs/owner_only/plans/fs_16_deterministic_strategy_research_admission_queue_2026_07_13.md
      - docs/owner_only/plans/fs_16_deterministic_candidate_strategies_2026_07_13.md
    resources: [fs16-queue-state, strategy-backtest]

  - key: fs16-t05-bounded-parameter-search
    title: FS16-T05 — Generate and screen multiple viable parameter combinations
    dependsOn: [fs16-t04-candidate-strategies]
    prompt: |
      Execute only FS16-T05. Build a bounded, deterministic parameter-search
      harness for the three registered long-only candidate families. Define the
      search grid before evaluation, enforce a hard combination/run budget, and
      prohibit searching the holdout interval. Deduplicate near-identical
      parameter sets and preserve all attempted configurations and rejection
      reasons. Rank only on training/validation evidence using the FS16-T01
      primary objective and guardrails.

      Retain several potentially workable combinations rather than one optimized
      winner: at least three distinct non-near-duplicate configurations overall,
      when the evidence supports them. Do not force a shortlist when thresholds
      fail; emit NO_VIABLE_CONFIGURATION if necessary. Add reproducibility,
      budget, deduplication and leakage tests. Run required checks, self-review,
      update only FS16-T05, commit with message
      "feat: add FS-16 bounded parameter search", push, and stop.
    model: terra
    effort: high
    timeoutMinutes: 120
    allowedPaths:
      - src/owner_only_sandbox
      - scripts
      - tests
      - data/processed/fs16
      - docs/owner_only/plans/fs_16_deterministic_strategy_research_admission_queue_2026_07_13.md
      - docs/owner_only/plans/fs_16_bounded_parameter_search_2026_07_13.md
    resources: [fs16-queue-state, strategy-backtest]

  - key: fs16-t06-holdout-walk-forward
    title: FS16-T06 — Run untouched holdout and walk-forward validation
    dependsOn: [fs16-t05-bounded-parameter-search]
    prompt: |
      Execute only FS16-T06. Evaluate every FS16-T05 shortlisted configuration
      exactly once on the preregistered untouched holdout and through the frozen
      walk-forward windows. Preserve failed candidates and reason codes. Report
      gross/net performance, drawdown, trade count, turnover, win/loss behavior,
      benchmark deltas and per-window consistency. The holdout must never feed
      parameter selection or threshold changes. If no configuration was validly
      shortlisted, emit a deterministic blocked evidence packet instead of
      inventing candidates.

      Produce sanitized machine-readable evidence under data/processed/fs16 and
      a durable review document. Add split-boundary, leakage and repeatability
      tests. Run required checks, self-review, update only FS16-T06, commit with
      message "test: validate FS-16 holdout and walk-forward results", push, and
      stop.
    model: terra
    effort: high
    timeoutMinutes: 120
    allowedPaths:
      - src/owner_only_sandbox
      - scripts
      - tests
      - data/processed/fs16
      - docs/owner_only/evidence/fs_16_holdout_walk_forward_validation_2026_07_13.md
      - docs/owner_only/plans/fs_16_deterministic_strategy_research_admission_queue_2026_07_13.md
    resources: [fs16-queue-state, strategy-backtest]

  - key: fs16-t07-robustness
    title: FS16-T07 — Test stability, regimes, concentration and increased costs
    dependsOn: [fs16-t06-holdout-walk-forward]
    prompt: |
      Execute only FS16-T07. Apply the preregistered robustness checks to all
      shortlisted configurations: neighboring-parameter stability, repeated-run
      determinism, market-regime slices, per-instrument contribution and P&L
      concentration, missing-session sensitivity, and increased commission/
      spread/slippage stress. Do not add new optimized parameters after observing
      holdout results. Preserve adverse findings and block candidates that depend
      on one instrument, one narrow period or optimistic costs beyond the frozen
      thresholds.

      Produce machine-readable results and
      docs/owner_only/evidence/fs_16_strategy_robustness_review_2026_07_13.md.
      Add focused tests, run required checks, self-review, update only FS16-T07,
      commit with message "test: evaluate FS-16 strategy robustness", push, and
      stop.
    model: terra
    effort: high
    timeoutMinutes: 120
    allowedPaths:
      - src/owner_only_sandbox
      - scripts
      - tests
      - data/processed/fs16
      - docs/owner_only/evidence/fs_16_strategy_robustness_review_2026_07_13.md
      - docs/owner_only/plans/fs_16_deterministic_strategy_research_admission_queue_2026_07_13.md
    resources: [fs16-queue-state, strategy-backtest]

  - key: fs16-t08-comparison
    title: FS16-T08 — Compare candidates using the frozen lexicographic objective
    dependsOn: [fs16-t07-robustness]
    prompt: |
      Execute only FS16-T08. Build a comparison packet over every attempted and
      shortlisted deterministic configuration plus cash and buy-and-hold
      benchmarks. Apply the frozen lexicographic decision rule: first satisfy
      sample, after-cost stability and drawdown guardrails; then rank robustness
      and consistency; use maximum after-cost return only as a secondary
      tie-breaker. Never hide rejected configurations or select on in-sample
      return alone. Include per-strategy, per-parameter, per-instrument,
      per-window and stressed-cost views with provenance and digests.

      Produce JSON evidence and
      docs/owner_only/evidence/fs_16_deterministic_strategy_comparison_2026_07_13.md.
      Run focused and required checks, self-review, update only FS16-T08, commit
      with message "docs: compare FS-16 deterministic strategies", push, and
      stop.
    model: auto
    minModel: terra
    effort: high
    timeoutMinutes: 90
    allowedPaths:
      - src/owner_only_sandbox
      - scripts
      - tests
      - data/processed/fs16
      - docs/owner_only/evidence/fs_16_deterministic_strategy_comparison_2026_07_13.md
      - docs/owner_only/evidence/fs_16_deterministic_strategy_comparison_2026_07_13.json
      - docs/owner_only/plans/fs_16_deterministic_strategy_research_admission_queue_2026_07_13.md
    resources: [fs16-queue-state, strategy-backtest]

  - key: fs16-t09-sandbox-admission
    title: FS16-T09 — Decide automatic no-write or sandbox admission
    dependsOn: [fs16-t08-comparison]
    prompt: |
      Execute only FS16-T09. Implement and run a deterministic admission decision
      over the frozen FS16-T01 criteria and completed FS16 evidence. The only
      possible outcomes are ADMIT_NO_WRITE_SANDBOX, DEFER_MORE_EVIDENCE, or
      REJECT_CANDIDATE_SET. Admission may retain more than one configuration
      only when each independently passes every hard gate; otherwise select the
      strongest passing configuration by the frozen comparison rule. Bind exact
      strategy/config/dataset/cost/evidence digests and expiry. Missing, stale,
      inconsistent or threshold-failing evidence must not admit.

      The result authorizes only read-only shadow evaluation or a proven isolated
      sandbox/test API. It must explicitly deny production endpoints, real-money
      orders, live readiness and automatic promotion. Produce a tested CLI,
      sanitized JSON decision and
      docs/owner_only/evidence/fs_16_sandbox_admission_decision_2026_07_13.md.
      Run required checks, self-review, update only FS16-T09, commit with message
      "feat: decide FS-16 sandbox strategy admission", push, and stop.
    model: auto
    minModel: terra
    effort: high
    timeoutMinutes: 90
    allowedPaths:
      - src/owner_only_sandbox
      - scripts
      - tests
      - docs/owner_only/evidence/fs_16_sandbox_admission_decision_2026_07_13.md
      - docs/owner_only/evidence/fs_16_sandbox_admission_decision_2026_07_13.json
      - docs/owner_only/plans/fs_16_deterministic_strategy_research_admission_queue_2026_07_13.md
    resources: [fs16-queue-state, strategy-admission]

  - key: fs16-t10-runtime-handoff
    title: FS16-T10 — Build the no-write runtime handoff packet
    dependsOn: [fs16-t09-sandbox-admission]
    prompt: |
      Execute only FS16-T10. Create a machine-readable and owner-review handoff
      packet for the next no-write runtime queue. If FS16-T09 admitted a
      configuration, bind its exact strategy/config/dataset/cost/admission
      digests, expiry, permitted read-only/sandbox environments, freshness
      requirements, risk inputs, expected signal cadence and stop conditions.
      If deferred or rejected, create a blocked handoff with exact reasons and
      no runnable configuration. Validate tampering, stale evidence and authority
      escalation failures.

      This packet must grant no production write, real-money order, live pilot
      or unattended real trading authority. Run focused and required checks,
      self-review, update only FS16-T10, commit with message
      "docs: create FS-16 no-write runtime handoff", push, and stop.
    model: auto
    minModel: terra
    effort: medium
    allowedPaths:
      - src/owner_only_sandbox
      - scripts
      - tests
      - docs/owner_only/evidence/fs_16_no_write_runtime_handoff_2026_07_13.md
      - docs/owner_only/evidence/fs_16_no_write_runtime_handoff_2026_07_13.json
      - docs/owner_only/plans/fs_16_deterministic_strategy_research_admission_queue_2026_07_13.md
    resources: [fs16-queue-state, strategy-admission]

  - key: fs16-t11-future-short-llm-comparison-handoff
    title: FS16-T11 — Define mandatory later short and separate LLM comparison lanes
    dependsOn: [fs16-t10-runtime-handoff]
    prompt: |
      Execute only FS16-T11. Define two separate future research lanes without
      implementing or running them now.

      Lane A is mandatory deterministic short validation. Specify additional
      evidence required for borrow availability, borrow cost, forced-close risk,
      short permissions, asymmetric loss controls and side-specific reporting.
      Long results must never imply short readiness.

      Lane B is a separately isolated LLM-assisted strategy experiment. Require
      frozen model/provider/version, prompt and tool contract, temperature or
      deterministic settings where available, input snapshot, latency/token
      cost, reproducibility measurement, hallucination/invalid-action controls
      and a deterministic fallback. LLM outputs may be studied only in backtest,
      read-only or verified sandbox/test environments and may not directly place
      real orders. Define a later common-basis comparison against the admitted
      deterministic strategy using the same dataset, periods, costs, risk limits
      and metrics.

      Produce
      docs/owner_only/plans/fs_16_future_short_and_llm_comparison_handoff_2026_07_13.md.
      Mark FS-16 complete only as deterministic long research/admission and
      record both future lanes as required separate scopes. Run documentation
      checks and git diff --check, self-review, update FS16-T11 and final queue
      status, commit with message
      "docs: define short and LLM strategy comparison follow-ups", push, and
      stop.
    model: auto
    minModel: terra
    effort: medium
    timeoutMinutes: 60
    allowedPaths:
      - docs/owner_only/plans/fs_16_future_short_and_llm_comparison_handoff_2026_07_13.md
      - docs/owner_only/plans/fs_16_deterministic_strategy_research_admission_queue_2026_07_13.md
    resources: [fs16-queue-state]
