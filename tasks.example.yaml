project:
  name: My project
  path: D:\\work\\my-project
  # Every authorization-enabled apply task must reference one independently
  # approved contract whose paths, preconditions, and verification commands
  # exactly match the task, along with approvalId, intent, technicalPermission,
  # and sideEffectRisk. A broader or merely similar apply approval does not
  # match. Read-only answer/review/diagnose tasks do not need an apply approval,
  # but still need their explicit non-mutating authorization.
  approvedApplyContracts:
    - approvalId: typecheck-fixes-v1
      intent: apply
      technicalPermission: reversible_local_write
      sideEffectRisk: reversible_local_write
      allowedPaths: [src/notifications]
      preconditions:
        - >-
          $status = @(git status --short);
          if ($status.Count -ne 0) {
          Write-Error "Expected a clean baseline: $($status -join ', ')";
          exit 1 };
          exit 0
      verificationCommands: [npm run typecheck]
    - approvalId: reconnect-logic-v1
      intent: apply
      technicalPermission: reversible_local_write
      sideEffectRisk: reversible_local_write
      allowedPaths: [src/websocket]
      verificationCommands: [npm test -- websocket]
    - approvalId: integration-tests-v1
      intent: apply
      technicalPermission: reversible_local_write
      sideEffectRisk: reversible_local_write
      allowedPaths: [tests/integration]
      verificationCommands: [npm test -- integration]
  # Windows pytest example: use a fresh direct child of TEMP for every Codex
  # process. Reusing pytest's default pytest-of-user directory, or a fixed
  # basetemp across executor/reviewer sessions, can fail with WinError 5.
  # verificationCommands:
  #   - >-
  #     & $env:PYTHON_BIN -m pytest -q
  #     --basetemp="$env:TEMP\orchestrator-pytest-$PID"
limits:
  taskTimeoutMinutes: 30
  reviewerTimeoutMinutes: 10
  maxTaskRetries: 1
  # A dependency-aware scheduler may run up to this many safe tasks.
  # Default 1 retains sequential execution.
  maxParallelTasks: 3
git:
  # Creates a checkpoint commit after each reviewer-approved task.
  checkpointCommits: false
tasks:
  # Every queue task must be independently useful, not an artificial phase of one outcome.
  # If production-owned code must be changed or called directly, keep the same task's implementation, tests, and benchmark together.
  # Its allowedPaths must include all production and test files required for that complete outcome.
  # Do not rely on a dependent task to retroactively grant paths or prove a prerequisite.
  # Stable `key` values let the orchestrator construct a dependency graph.
  # Tasks with no unmet dependsOn entries may run in parallel.
  - key: typecheck-fixes
    title: Fix TypeScript errors
    prompt: Fix TypeScript errors in the notifications module and run the relevant checks.
    # The orchestrator resolves Auto before the run and records the result.
    model: auto
    effort: medium
    # Optional per-task overrides:
    # timeoutMinutes: 45
    # maxRetries: 2
    allowedPaths: [src/notifications]
    # Machine-executed, read-only baseline checks belong in `preconditions`.
    # They run before Codex. A non-zero exit, timeout, or worktree mutation
    # blocks the task without starting the executor.
    preconditions:
      - >-
        $status = @(git status --short);
        if ($status.Count -ne 0) {
        Write-Error "Expected a clean baseline: $($status -join ', ')";
        exit 1 };
        exit 0
    verificationCommands:
      - npm run typecheck
      # Keep substantial logic in a versioned script. Preflight rejects long
      # inline `python -c` and PowerShell programs.
      # These commands run after the task changes. Do not require the whole
      # worktree to be clean (`git diff --quiet` / `--exit-code`) here: a
      # successful writing task necessarily has an allowed diff.
      #
      # If the prompt requires document review or exact path/line evidence,
      # include bounded or targeted content output. SHA-256 and Test-Path prove
      # identity/existence, not content correctness. Preflight parses detected
      # PowerShell commands and rejects syntax errors before execution.
      # - >-
      #   rg -n "contract|invariant|decision"
      #   'src/notifications/result.ts'
      # For a bounded excerpt instead of a targeted search:
      # - >-
      #   Get-Content -LiteralPath 'src/notifications/result.ts'
      #   -TotalCount 120
      # Ordinary `git diff --check -- <path>` does not inspect a new untracked
      # file. For such files, use a content-aware PowerShell check like this
      # (replace the example path). `git diff --no-index` normally exits 1
      # when files differ, so validate its diagnostic output instead.
      # - >-
      #   $result = git diff --no-index --check -- NUL
      #   'src/notifications/new-file.ts' 2>&1;
      #   if ($result) {
      #   $result | ForEach-Object { Write-Output $_ }; exit 1 };
      #   exit 0
    # Optional Context Contract v1 selection. The target repository's helper
    # validates this profile and supplies the exact execution bundle.
    contextProfile: review
    maxSources: 8
    # Opt in when the fixed AGENTS.md/README.md controlled fallback would be
    # too small; helper failure then blocks preflight instead of reduced context.
    requireRepositoryContext: true
    # Human-readable stop rules still belong in executionGuards. Put any
    # machine-testable baseline condition in `preconditions` above.
    executionGuards:
      - Stop if an allowed path has pre-existing user changes before work begins.
    authorization:
      enabled: true
      intent: apply
      technicalPermission: reversible_local_write
      sideEffectRisk: reversible_local_write
      approvalId: typecheck-fixes-v1
    # Named resources are exclusive across concurrently running tasks.
    resources: [typescript-check]
  - key: reconnect-logic
    title: Add reconnect logic
    prompt: Add WebSocket reconnection with exponential backoff and tests.
    model: auto
    minModel: terra
    effort: medium
    allowedPaths: [src/websocket]
    verificationCommands: [npm test -- websocket]
    executionGuards:
      - Stop if the requested reconnect behavior requires edits outside the allowed path.
    authorization:
      enabled: true
      intent: apply
      technicalPermission: reversible_local_write
      sideEffectRisk: reversible_local_write
      approvalId: reconnect-logic-v1
    resources: [websocket-test-server]
  - key: integration-tests
    title: Add integration coverage
    prompt: Add integration tests for the TypeScript fixes and WebSocket reconnect behavior.
    model: terra
    effort: medium
    # This task waits for both independent implementation branches.
    dependsOn: [typecheck-fixes, reconnect-logic]
    # When this task requires actual checkpoint commits rather than only
    # successful predecessors, enable git.checkpointCommits above and list
    # those direct dependencies here. Runtime blocks if a predecessor had no
    # task-owned diff and therefore produced no checkpoint.
    # requiresCheckpointsFrom: [typecheck-fixes, reconnect-logic]
    # Use `allowedPaths: []` for a read-only task; reviewer rejection then
    # fails closed without an automatic correction attempt.
    allowedPaths: [tests/integration]
    verificationCommands: [npm test -- integration]
    executionGuards:
      - Stop if integration coverage requires production edits outside the declared predecessor tasks.
    authorization:
      enabled: true
      intent: apply
      technicalPermission: reversible_local_write
      sideEffectRisk: reversible_local_write
      approvalId: integration-tests-v1
  - key: review-integration
    title: Review the completed integration result
    # This independent read-only review may consume only the fixed, recorded
    # Orchestrator verification evidence from its completed predecessor. Its
    # own verification runs after this executor ends, so it cannot support this
    # executor's conclusion. Prefer this pattern after one complete
    # implementation/verification task; use a later queue only when a
    # write-based closure record is mandatory.
    prompt: Review the completed integration using fixed predecessor verification evidence and source inspection; report findings without edits.
    model: terra
    effort: medium
    dependsOn: [integration-tests]
    allowedPaths: []
    verificationCommands:
      - npm test -- integration
      - git diff --check
    executionGuards:
      - Read-only review only; do not edit, repair, commit, or push files.
      - Treat missing, failed, or timed-out Orchestrator verification evidence as a finding.
    authorization:
      enabled: true
      intent: review
      technicalPermission: read_only
      sideEffectRisk: none
